<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login — ShopSphere</title>
<meta name="description" content="Log in to your ShopSphere account to view orders, wishlist and profile.">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/components.css">
<link rel="stylesheet" href="css/responsive.css">
</head>
<body data-page="login">

<header class="navbar">
  <div class="container navbar-inner">
    <a href="index.html" class="navbar-logo">Shop<span>Sphere</span></a>
    <div style="flex:1;"></div>
    <div class="navbar-actions">
      <button data-theme-toggle aria-label="Toggle dark mode">🌙</button>
    </div>
  </div>
</header>

<main class="auth-wrapper">
  <div class="auth-card">
    <h1>Welcome Back</h1>
    <p class="auth-sub">Log in to continue to ShopSphere.</p>
    <form class="auth-form" id="login-form" novalidate>
      <div class="form-group">
        <label for="login-email">Email</label>
        <input type="email" id="login-email" required>
      </div>
      <div class="form-group">
        <label for="login-password">Password</label>
        <input type="password" id="login-password" required minlength="4">
      </div>
      <div class="auth-row">
        <label class="auth-check">
          <input type="checkbox" id="remember-me"> Remember me
        </label>
        <a href="#" id="forgot-password-link">Forgot password?</a>
      </div>
      <button type="submit" class="btn btn-primary btn-block btn-lg">Login</button>
    </form>
    <p class="auth-footer">Don't have an account? <a href="register.html">Register</a></p>
  </div>
</main>

<script src="js/data.js"></script>
<script src="js/utils.js"></script>
<script src="js/app.js"></script>
<script src="js/auth.js"></script>
</body>
</html>
