<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Register — ShopSphere</title>
<meta name="description" content="Create a new ShopSphere account to start shopping.">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/components.css">
<link rel="stylesheet" href="css/responsive.css">
</head>
<body data-page="register">

<header class="navbar">
  <div class="container navbar-inner">
    <a href="index.html" class="navbar-logo">Shop<span>Sphere</span></a>
    <div style="flex:1;"></div>
    <div class="navbar-actions">
      <button data-theme-toggle aria-label="Toggle dark mode">🌙</button>
    </div>
  </div>
</header>

<main class="auth-wrapper">
  <div class="auth-card">
    <h1>Create Account</h1>
    <p class="auth-sub">Join ShopSphere to start shopping today.</p>
    <form class="auth-form" id="register-form" novalidate>
      <div class="form-group">
        <label for="register-name">Full Name</label>
        <input type="text" id="register-name" required>
      </div>
      <div class="form-group">
        <label for="register-email">Email</label>
        <input type="email" id="register-email" required>
      </div>
      <div class="form-group">
        <label for="register-password">Password</label>
        <input type="password" id="register-password" required minlength="6">
      </div>
      <div class="form-group">
        <label for="register-confirm">Confirm Password</label>
        <input type="password" id="register-confirm" required minlength="6">
      </div>
      <button type="submit" class="btn btn-primary btn-block btn-lg">Create Account</button>
    </form>
    <p class="auth-footer">Already have an account? <a href="login.html">Login</a></p>
  </div>
</main>

<script src="js/data.js"></script>
<script src="js/utils.js"></script>
<script src="js/app.js"></script>
<script src="js/auth.js"></script>
</body>
</html>
